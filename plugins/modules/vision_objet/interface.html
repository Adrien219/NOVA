<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S.H.O.S · Vision Objet</title>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════
   MODULE : VISION OBJET — S.H.O.S design system
   Logique originale (plugin_data / renderDetections) conservée
═══════════════════════════════════════════════ */
:root {
  --bg:    #0e1117;
  --glass: rgba(255,255,255,0.055);
  --border:rgba(255,255,255,0.09);
  --y:     #e8d44d;
  --blue:  #4da6ff;
  --green: #34c759;
  --red:   #ff453a;
  --t1:    rgba(255,255,255,0.93);
  --t2:    rgba(255,255,255,0.52);
  --t3:    rgba(255,255,255,0.28);
  --font:  'DM Sans', system-ui, sans-serif;
  --mono:  'DM Mono', monospace;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;font-family:var(--font);background:var(--bg);color:var(--t1)}

/* ── LAYOUT PRINCIPAL ── */
.wrap { height:100vh; display:flex; flex-direction:column; }

/* ── HEADER ── */
.hdr {
  display:flex; align-items:center; justify-content:space-between;
  padding:clamp(7px,1.8vh,12px) clamp(10px,2vw,16px);
  background:rgba(14,17,23,.97); border-bottom:1px solid var(--border);
  flex-shrink:0; gap:8px;
}
.hdr-l { display:flex; align-items:center; gap:7px; min-width:0; }
.m-ico { width:20px; height:20px; border-radius:6px; background:rgba(77,166,255,.12); border:1px solid rgba(77,166,255,.25); display:flex; align-items:center; justify-content:center; font-size:11px; flex-shrink:0; }
.m-name { font-size:clamp(9px,1.6vw,11px); font-weight:500; letter-spacing:.08em; text-transform:uppercase; color:var(--t2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.spill {
  display:flex; align-items:center; gap:4px; padding:3px 9px; border-radius:10px;
  background:rgba(255,255,255,.06); border:1px solid var(--border);
  font-family:var(--mono); font-size:clamp(8px,1.4vw,10px); color:var(--t2); flex-shrink:0;
}
.dot { width:5px; height:5px; border-radius:50%; }
.d-ok { background:var(--green); box-shadow:0 0 6px var(--green); animation:blink 1.5s ease-in-out infinite; }
.d-w  { background:rgba(255,255,255,.3); }
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

/* ── ZONE CENTRALE ── */
.main {
  flex:1; display:grid;
  grid-template-columns:1fr clamp(100px,28%,180px);
  overflow:hidden; min-height:0;
}

/* Vidéo */
.video-zone {
  position:relative; background:#000;
  display:flex; align-items:center; justify-content:center;
  overflow:hidden; border-right:1px solid var(--border);
}
.video-zone img { width:100%; height:100%; object-fit:cover; display:block; }
.video-zone img[src=""] { display:none; }

/* Ligne de scan HUD */
.scan-line {
  position:absolute; left:0; right:0; height:1.5px;
  background:linear-gradient(90deg, transparent, var(--blue), transparent);
  box-shadow:0 0 8px var(--blue);
  animation:scan 3s linear infinite; top:0; pointer-events:none;
}
@keyframes scan { 0%{top:0} 50%{top:100%} 100%{top:0} }

/* Badge geste overlay */
.ai-badge {
  position:absolute; top:8px; left:8px; z-index:5;
  padding:4px 10px; border-radius:6px;
  background:rgba(77,166,255,.18); border:1px solid rgba(77,166,255,.35);
  font-family:var(--mono); font-size:clamp(8px,1.4vw,10px); color:var(--blue);
  letter-spacing:.08em; transition:all .3s;
}
.ai-badge.alert { background:rgba(52,199,89,.18); border-color:rgba(52,199,89,.35); color:var(--green); }

/* Compteur overlay */
.count-badge {
  position:absolute; top:8px; right:8px; z-index:5;
  padding:3px 8px; border-radius:6px;
  background:rgba(232,212,77,.14); border:1px solid rgba(232,212,77,.3);
  font-family:var(--mono); font-size:10px; color:var(--y);
}

/* ── SIDEBAR DÉTECTIONS ── */
.sidebar {
  display:flex; flex-direction:column;
  background:rgba(14,17,23,.95); overflow-y:auto; min-width:0;
}
.sidebar::-webkit-scrollbar { width:3px; }
.sidebar::-webkit-scrollbar-thumb { background:rgba(255,255,255,.08); }

.sb-head {
  padding:8px 10px 6px; border-bottom:1px solid var(--border);
  font-family:var(--mono); font-size:9px; letter-spacing:.10em;
  text-transform:uppercase; color:var(--t3); flex-shrink:0;
}

/* Zone des cartes détection */
#detection-list {
  flex:1; padding:6px; display:flex; flex-direction:column; gap:5px;
  overflow-y:auto;
}
#detection-list::-webkit-scrollbar { width:3px; }
#detection-list::-webkit-scrollbar-thumb { background:rgba(255,255,255,.08); }

#no-detection {
  padding:12px 8px; text-align:center;
  font-size:10px; color:var(--t3); font-family:var(--mono);
  line-height:1.5;
}

.detection-card {
  padding:7px 9px; border-radius:8px;
  background:rgba(255,255,255,.04); border:1px solid var(--border);
  transition:all .25s ease; animation:cardIn .25s ease;
}
.detection-card.active {
  background:rgba(52,199,89,.08); border-color:rgba(52,199,89,.3);
}
@keyframes cardIn { from{opacity:0;transform:translateX(6px)} to{opacity:1;transform:none} }

.det-name {
  font-size:clamp(10px,1.6vw,12px); font-weight:600; color:var(--t1);
  text-transform:capitalize; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.det-count {
  font-family:var(--mono); font-size:9px; color:var(--t3); margin-top:2px;
}
.det-bar { height:2px; background:rgba(255,255,255,.08); border-radius:1px; margin-top:5px; overflow:hidden; }
.det-bar-fill { height:100%; background:var(--green); border-radius:1px; transition:width .4s; }
</style>
</head>
<body>
<div class="wrap">

  <!-- HEADER -->
  <header class="hdr">
    <div class="hdr-l">
      <div class="m-ico">👁</div>
      <span class="m-name">{{ config.name if config else 'Vision Objet' }}</span>
    </div>
    <div class="spill">
      <div class="dot d-ok" id="ai-dot"></div>
      <span id="ai-status">MEDIAPIPE</span>
    </div>
  </header>

  <!-- MAIN -->
  <div class="main">

    <!-- VIDÉO -->
    <div class="video-zone">
      <div class="scan-line"></div>
      <div class="ai-badge" id="ai-badge">IA ACTIVE</div>
      <div class="count-badge" id="count-badge" style="display:none">0 obj.</div>
      <img src="/video_feed" id="video_stream" alt="Vision Objet"
           onerror="this.style.display='none'">
    </div>

    <!-- SIDEBAR -->
    <div class="sidebar">
      <div class="sb-head">Détections</div>
      <div id="detection-list">
        <div id="no-detection">Aucun<br>objet<br>détecté...</div>
      </div>
    </div>

  </div>
</div>

<script>
const socket = io();
const detList   = document.getElementById('detection-list');
const noDet     = document.getElementById('no-detection');
const aiBadge   = document.getElementById('ai-badge');
const countBadge= document.getElementById('count-badge');

/* ── Logique originale conservée ── */
socket.on('plugin_data', function(data) {
  if (data.plugin === "vision_objet") {
    renderDetections(data.found);
  }
});

function renderDetections(objects) {
  // Nettoyage (conserve le no-detection placeholder)
  const cards = document.querySelectorAll('.detection-card');
  cards.forEach(c => c.remove());

  if (!objects || objects.length === 0) {
    noDet.style.display = 'block';
    aiBadge.textContent = 'SCAN EN COURS';
    aiBadge.classList.remove('alert');
    countBadge.style.display = 'none';
    return;
  }

  noDet.style.display = 'none';
  aiBadge.textContent = objects.length + ' OBJET' + (objects.length>1?'S':'') + ' D\u00c9TECT\u00c9' + (objects.length>1?'S':'');
  aiBadge.classList.add('alert');
  countBadge.textContent = objects.length + ' obj.';
  countBadge.style.display = 'block';

  // Comptage occurrences (logique originale)
  const counts = {};
  objects.forEach(obj => counts[obj] = (counts[obj] || 0) + 1);
  const maxCount = Math.max(...Object.values(counts));

  for (const [name, count] of Object.entries(counts)) {
    const card = document.createElement('div');
    card.className = 'detection-card active';
    card.innerHTML =
      '<div class="det-name">' + name + '</div>' +
      '<div class="det-count">x' + count + '</div>' +
      '<div class="det-bar"><div class="det-bar-fill" style="width:' + Math.round((count/maxCount)*100) + '%"></div></div>';
    detList.appendChild(card);
    setTimeout(() => card.classList.remove('active'), 600);
  }
}

socket.on('disconnect', () => {
  document.getElementById('ai-status').textContent = 'HORS LIGNE';
  document.getElementById('ai-dot').className = 'dot';
  document.getElementById('ai-dot').style.background = '#ff453a';
});
</script>
</body>
</html>
