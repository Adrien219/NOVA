<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N.O.V.A - {{ config.name }}</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        :root {
            --vision-blue: #00d4ff;
            --vision-bg: #050a14;
            --detection-gold: #ffcc00;
        }

        body {
            background: var(--vision-bg);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
            border: 2px solid var(--vision-blue);
        }

        /* En-tête HUD */
        .header {
            padding: 15px;
            background: rgba(0, 212, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--vision-blue);
        }

        .status-badge {
            padding: 5px 15px;
            border-radius: 20px;
            background: rgba(0, 255, 136, 0.2);
            border: 1px solid #00ff88;
            font-size: 0.8rem;
            text-transform: uppercase;
        }

        /* Layout Principal */
        .main-container {
            display: grid;
            grid-template-columns: 1fr 300px;
            flex-grow: 1;
            overflow: hidden;
        }

        /* Section Vidéo */
        .video-feed {
            position: relative;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .video-feed img {
            max-width: 100%;
            height: auto;
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* Overlay de détection (Viseur) */
        .scanner-line {
            position: absolute;
            width: 100%;
            height: 2px;
            background: var(--vision-blue);
            box-shadow: 0 0 15px var(--vision-blue);
            animation: scan 3s infinite linear;
            top: 0;
        }

        @keyframes scan {
            0% { top: 0; }
            50% { top: 100%; }
            100% { top: 0; }
        }

        /* Barre Latérale Detections */
        .sidebar {
            background: rgba(0, 0, 0, 0.5);
            border-left: 1px solid var(--vision-blue);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .detection-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 212, 255, 0.3);
            padding: 15px;
            border-radius: 8px;
            transition: all 0.3s;
        }

        .detection-card.active {
            border-color: var(--detection-gold);
            background: rgba(255, 204, 0, 0.1);
            transform: scale(1.02);
        }

        .object-name {
            font-size: 1.2rem;
            color: var(--vision-blue);
            font-weight: bold;
            text-transform: capitalize;
        }

        .back-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            padding: 10px 20px;
            background: transparent;
            border: 1px solid white;
            color: white;
            text-decoration: none;
            font-size: 0.8rem;
            transition: 0.3s;
        }

        .back-btn:hover { background: white; color: black; }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <strong style="color: var(--vision-blue);">MODULE:</strong> {{ config.name }}
        </div>
        <div class="status-badge" id="ai-status">YOLOv8 ACTIF</div>
    </div>

    <div class="main-container">
        <div class="video-feed">
            <div class="scanner-line"></div>
            <img src="/video_feed_pi" alt="Flux N.O.V.A">
        </div>

        <div class="sidebar" id="detection-list">
            <h3 style="color: var(--vision-blue); border-bottom: 1px solid; padding-bottom: 5px;">ANALYSE SCÈNE</h3>
            <div id="no-detection" style="opacity: 0.5; font-style: italic;">Aucun objet détecté...</div>
            </div>
    </div>

    <a href="/" class="back-btn">RETOUR ACCUEIL</a>

    <script>
        const socket = io();
        const detectionList = document.getElementById('detection-list');
        const noDetection = document.getElementById('no-detection');

        // On écoute les données de détection relayées par nova.py (depuis MQTT)
        socket.on('plugin_data', function(data) {
            // On vérifie que les données viennent bien de ce plugin
            if (data.plugin === "vision_objet") {
                renderDetections(data.found);
            }
        });

        function renderDetections(objects) {
            // Nettoyage (sauf titre et message vide)
            const cards = document.querySelectorAll('.detection-card');
            cards.forEach(c => c.remove());

            if (!objects || objects.length === 0) {
                noDetection.style.display = 'block';
                return;
            }

            noDetection.style.display = 'none';

            // On compte les occurrences (ex: 2 persons)
            const counts = {};
            objects.forEach(obj => counts[obj] = (counts[obj] || 0) + 1);

            for (const [name, count] of Object.entries(counts)) {
                const card = document.createElement('div');
                card.className = 'detection-card active';
                card.innerHTML = `
                    <div class="object-name">${name}</div>
                    <div style="font-size: 0.8rem; color: #aaa;">Quantité: ${count}</div>
                `;
                detectionList.appendChild(card);

                // Petit effet de flash pour montrer la mise à jour
                setTimeout(() => card.classList.remove('active'), 500);
            }
        }
    </script>
</body>
</html>
