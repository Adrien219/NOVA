<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S.H.O.S · Contrôle Gestuel</title>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════
   MODULE : CONTRÔLE GESTUEL — S.H.O.S
   Logique originale (plugin_data / hand_control) conservée
═══════════════════════════════════════════════ */
:root {
  --bg:    #0e1117;
  --glass: rgba(255,255,255,0.055);
  --border:rgba(255,255,255,0.09);
  --y:     #e8d44d;
  --y2:    rgba(232,212,77,0.12);
  --blue:  #4da6ff;
  --green: #34c759;
  --red:   #ff453a;
  --t1:    rgba(255,255,255,0.93);
  --t2:    rgba(255,255,255,0.52);
  --t3:    rgba(255,255,255,0.28);
  --font:  'DM Sans', system-ui, sans-serif;
  --mono:  'DM Mono', monospace;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;font-family:var(--font);background:var(--bg);color:var(--t1)}

.wrap { height:100vh; display:flex; flex-direction:column; }

/* ── HEADER ── */
.hdr {
  display:flex; align-items:center; justify-content:space-between;
  padding:clamp(7px,1.8vh,12px) clamp(10px,2vw,16px);
  background:rgba(14,17,23,.97); border-bottom:1px solid var(--border);
  flex-shrink:0; gap:8px;
}
.hdr-l { display:flex; align-items:center; gap:7px; min-width:0; }
.m-ico { width:20px; height:20px; border-radius:6px; background:rgba(52,199,89,.12); border:1px solid rgba(52,199,89,.25); display:flex; align-items:center; justify-content:center; font-size:11px; flex-shrink:0; }
.m-name { font-size:clamp(9px,1.6vw,11px); font-weight:500; letter-spacing:.08em; text-transform:uppercase; color:var(--t2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.spill { display:flex; align-items:center; gap:4px; padding:3px 9px; border-radius:10px; background:rgba(255,255,255,.06); border:1px solid var(--border); font-family:var(--mono); font-size:clamp(8px,1.4vw,10px); color:var(--t2); flex-shrink:0; }
.dot { width:5px; height:5px; border-radius:50%; }
.d-ok { background:var(--green); box-shadow:0 0 6px var(--green); animation:blink 1.5s ease-in-out infinite; }
.d-w  { background:rgba(255,255,255,.3); }
.d-y  { background:var(--y); box-shadow:0 0 6px var(--y); }
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

/* ── MAIN LAYOUT ── */
.main {
  flex:1; display:grid;
  grid-template-columns:1fr clamp(110px,30%,190px);
  overflow:hidden; min-height:0;
}

/* Vidéo */
.video-zone {
  position:relative; background:#000;
  display:flex; align-items:center; justify-content:center;
  overflow:hidden; border-right:1px solid var(--border);
}
.video-zone img { width:100%; height:100%; object-fit:cover; }

/* Badge geste actuel */
.gesture-badge {
  position:absolute; top:8px; left:8px; z-index:5;
  padding:5px 11px; border-radius:7px;
  background:rgba(52,199,89,.15); border:1px solid rgba(52,199,89,.3);
  font-family:var(--mono); font-size:clamp(9px,1.5vw,11px); color:var(--green);
  letter-spacing:.08em; text-transform:uppercase; transition:all .25s;
  max-width:calc(100% - 20px); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.gesture-badge.active {
  background:rgba(77,166,255,.2); border-color:rgba(77,166,255,.4); color:var(--blue);
}
.gesture-badge.confirmed {
  background:rgba(232,212,77,.18); border-color:rgba(232,212,77,.4); color:var(--y);
}

/* Toast validation */
.toast {
  position:absolute; bottom:12px; left:50%; transform:translateX(-50%);
  padding:7px 18px; border-radius:20px;
  background:rgba(52,199,89,.9); color:#0e1117;
  font-family:var(--mono); font-size:clamp(10px,1.8vw,12px); font-weight:700;
  letter-spacing:.08em; z-index:10; white-space:nowrap;
  display:none; box-shadow:0 4px 16px rgba(52,199,89,.4);
  animation:toastIn .25s ease;
}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* ── SIDEBAR COMMANDES ── */
.sidebar {
  background:rgba(14,17,23,.95); display:flex; flex-direction:column; overflow:hidden;
}
.sb-head {
  padding:7px 10px 5px; border-bottom:1px solid var(--border);
  font-family:var(--mono); font-size:9px; letter-spacing:.10em;
  text-transform:uppercase; color:var(--t3); flex-shrink:0;
}

.cmd-list {
  flex:1; overflow-y:auto; padding:6px; display:flex; flex-direction:column; gap:4px;
}
.cmd-list::-webkit-scrollbar{width:3px}
.cmd-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08)}

.command-item {
  padding:clamp(6px,1.5vh,9px) 9px; border-radius:8px;
  background:rgba(255,255,255,.04); border:1px solid var(--border);
  font-size:clamp(9px,1.6vw,11px); color:var(--t2);
  transition:all .22s ease; cursor:default;
  display:flex; align-items:center; gap:6px;
  white-space:nowrap; overflow:hidden;
}
.cmd-emoji { font-size:clamp(11px,2vw,14px); flex-shrink:0; }
.cmd-label { overflow:hidden; text-overflow:ellipsis; }
.command-item.active {
  background:rgba(52,199,89,.12); border-color:rgba(52,199,89,.35);
  color:var(--green); font-weight:600;
  box-shadow:0 0 10px rgba(52,199,89,.08);
}
.command-item.flash {
  background:rgba(255,255,255,.14); color:var(--t1);
}
</style>
</head>
<body>
<div class="wrap">

  <!-- HEADER -->
  <header class="hdr">
    <div class="hdr-l">
      <div class="m-ico">✋</div>
      <span class="m-name">{{ config.name if config else 'Contrôle Gestuel' }}</span>
    </div>
    <div class="spill">
      <div class="dot d-ok" id="gesture-dot"></div>
      <span id="gesture-status">SCANNING</span>
    </div>
  </header>

  <!-- MAIN -->
  <div class="main">

    <!-- VIDÉO -->
    <div class="video-zone">
      <div class="gesture-badge" id="current-gesture">SCANNING...</div>
      <div class="toast" id="status-toast">✓ VALIDÉ</div>
      <img src="/video_feed" id="main-video" alt="Flux caméra"
           onerror="this.style.display='none'">
    </div>

    <!-- COMMANDES -->
    <div class="sidebar">
      <div class="sb-head">Commandes</div>
      <div class="cmd-list">
        <div class="command-item" id="START_SYSTEM">
          <span class="cmd-emoji">🖐</span>
          <span class="cmd-label">Pleine main : Start</span>
        </div>
        <div class="command-item" id="STOP_SYSTEM">
          <span class="cmd-emoji">✊</span>
          <span class="cmd-label">Poing : Stop</span>
        </div>
        <div class="command-item" id="READ_TEXT">
          <span class="cmd-emoji">☝️</span>
          <span class="cmd-label">Index : Lire texte</span>
        </div>
        <div class="command-item" id="TRIGGER_FLORENCE">
          <span class="cmd-emoji">👍</span>
          <span class="cmd-label">Pouce : Florence-2</span>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
const socket  = io();
const badge   = document.getElementById('current-gesture');
const toast   = document.getElementById('status-toast');
const dot     = document.getElementById('gesture-dot');
const statEl  = document.getElementById('gesture-status');
const vimg    = document.getElementById('main-video');

/* ── Logique originale conservée ── */
socket.on('plugin_data', function(data) {
  if (data.plugin === "hand_control") {
    const gesture     = data.gesture || 'NONE';
    const isConfirmed = data.status === "confirmed";

    // 1. Badge geste en cours
    if (gesture !== 'NONE') {
      badge.textContent = gesture.replace('_', ' ');
      badge.className   = 'gesture-badge active';
      dot.className     = 'dot d-y';
      statEl.textContent= gesture.replace('_', ' ');
    } else {
      badge.textContent = 'SCANNING...';
      badge.className   = 'gesture-badge';
      dot.className     = 'dot d-ok';
      statEl.textContent= 'SCANNING';
    }

    // 2. Highlight commande (logique originale)
    document.querySelectorAll('.command-item').forEach(el => el.classList.remove('active'));
    const activeItem = document.getElementById(gesture);
    if (activeItem) activeItem.classList.add('active');

    // 3. Validation confirmée (toast + flash)
    if (isConfirmed && gesture !== 'NONE') {
      badge.className = 'gesture-badge confirmed';
      toast.innerHTML = '✅ ' + gesture.replace('_', ' ');
      toast.style.display = 'block';

      if (activeItem) {
        activeItem.classList.add('flash');
        setTimeout(() => activeItem.classList.remove('flash'), 300);
      }
      setTimeout(() => { toast.style.display = 'none'; }, 2000);
    }
  }
});

socket.on('disconnect', () => {
  dot.className = 'dot';
  dot.style.background = '#ff453a';
  statEl.textContent = 'DÉCONNECTÉ';
});
</script>
</body>
</html>
