<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S.H.O.S · Danger Monitor</title>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════
   MODULE : DANGER MONITOR — S.H.O.S
   Logique originale (module_update / sensor_update / renderAlerts) conservée
═══════════════════════════════════════════════ */
:root {
  --bg:    #0e1117;
  --glass: rgba(255,255,255,0.055);
  --border:rgba(255,255,255,0.09);
  --y:     #e8d44d;
  --blue:  #4da6ff;
  --green: #34c759;
  --red:   #ff453a;
  --amber: #ffa340;
  --t1:    rgba(255,255,255,0.93);
  --t2:    rgba(255,255,255,0.52);
  --t3:    rgba(255,255,255,0.28);
  --font:  'DM Sans', system-ui, sans-serif;
  --mono:  'DM Mono', monospace;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;font-family:var(--font);background:var(--bg);color:var(--t1);transition:background .5s}

/* État danger global */
body.alert-active { background:linear-gradient(135deg,rgba(255,69,58,.08),var(--bg)); }

.wrap { height:100vh; display:flex; flex-direction:column; }

/* ── HEADER ── */
.hdr {
  display:flex; align-items:center; justify-content:space-between;
  padding:clamp(7px,1.8vh,12px) clamp(10px,2vw,16px);
  background:rgba(14,17,23,.97); border-bottom:1px solid var(--border);
  flex-shrink:0; gap:8px; transition:border-color .3s;
}
.hdr.danger { border-bottom-color:rgba(255,69,58,.5); }
.hdr-l { display:flex; align-items:center; gap:7px; min-width:0; }
.m-ico { width:20px; height:20px; border-radius:6px; background:rgba(255,69,58,.12); border:1px solid rgba(255,69,58,.25); display:flex; align-items:center; justify-content:center; font-size:11px; flex-shrink:0; }
.m-name { font-size:clamp(9px,1.6vw,11px); font-weight:500; letter-spacing:.08em; text-transform:uppercase; color:var(--t2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

.status-text {
  font-family:var(--mono); font-size:clamp(8px,1.4vw,10px);
  letter-spacing:.10em; text-transform:uppercase; color:var(--green);
  transition:color .3s; white-space:nowrap;
}
.status-text.danger { color:var(--red); animation:pulse-txt .5s ease-in-out infinite alternate; }
@keyframes pulse-txt{from{opacity:1}to{opacity:.5}}

/* ── ZONE CENTRALE ── */
.center {
  flex:1; display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  gap:clamp(10px,3vh,20px);
  padding:clamp(8px,2vh,16px);
  overflow:hidden; min-height:0;
}

/* Radar */
.radar-wrap { position:relative; flex-shrink:0; }

.radar-circle {
  width:clamp(80px,25vw,140px); height:clamp(80px,25vw,140px);
  border-radius:50%;
  border:1.5px solid var(--green);
  box-shadow:0 0 16px rgba(52,199,89,.15), inset 0 0 16px rgba(52,199,89,.06);
  display:flex; align-items:center; justify-content:center; flex-direction:column;
  position:relative; transition:all .35s ease;
}
.radar-circle.danger {
  border-color:var(--red);
  box-shadow:0 0 20px rgba(255,69,58,.3), inset 0 0 16px rgba(255,69,58,.1);
  animation:pulse-radar .6s ease-in-out infinite alternate;
}
@keyframes pulse-radar{from{box-shadow:0 0 16px rgba(255,69,58,.2)}to{box-shadow:0 0 28px rgba(255,69,58,.5)}}

.radar-sweep {
  position:absolute; width:100%; height:100%; border-radius:50%;
  background:conic-gradient(from 0deg, transparent 80%, rgba(52,199,89,.2));
  animation:rotate 3s linear infinite; pointer-events:none;
}
.radar-circle.danger .radar-sweep {
  background:conic-gradient(from 0deg, transparent 80%, rgba(255,69,58,.2));
}
@keyframes rotate{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

#dist-val {
  font-family:var(--mono); font-size:clamp(18px,5vw,32px); font-weight:700;
  color:var(--green); line-height:1; transition:color .3s; position:relative; z-index:1;
}
#dist-val.danger { color:var(--red); }
.dist-unit { font-family:var(--mono); font-size:clamp(7px,1.2vw,9px); color:var(--t3); letter-spacing:.1em; position:relative; z-index:1; }

/* Gaz */
.gas-row {
  display:flex; align-items:center; gap:8px;
  background:var(--glass); border:1px solid var(--border); border-radius:8px;
  padding:7px 12px; width:100%; max-width:240px; flex-shrink:0;
}
.gas-label { font-family:var(--mono); font-size:9px; color:var(--t3); letter-spacing:.08em; text-transform:uppercase; flex-shrink:0; }
.gas-bar-wrap { flex:1; height:4px; background:rgba(255,255,255,.08); border-radius:2px; overflow:hidden; }
.gas-bar { height:100%; background:var(--amber); border-radius:2px; width:0%; transition:width .5s, background .3s; }
.gas-bar.danger { background:var(--red); }
#gas-num { font-family:var(--mono); font-size:clamp(10px,1.8vw,12px); font-weight:600; color:var(--amber); transition:color .3s; flex-shrink:0; min-width:36px; text-align:right; }
#gas-num.danger { color:var(--red); }

/* ── LOG ALERTES ── */
.alerts-panel {
  flex-shrink:0; width:100%; max-width:340px;
  background:rgba(14,17,23,.95); border:1px solid var(--border);
  border-radius:10px; overflow:hidden;
}
.alerts-head {
  padding:5px 10px; border-bottom:1px solid var(--border);
  font-family:var(--mono); font-size:9px; letter-spacing:.10em;
  text-transform:uppercase; color:var(--t3);
  display:flex; align-items:center; gap:6px;
}
.alert-count {
  margin-left:auto; font-family:var(--mono); font-size:9px;
  padding:1px 6px; border-radius:5px;
  background:rgba(255,69,58,.12); color:var(--red); display:none;
}
.alert-count.visible { display:block; }

.alerts-log {
  max-height:clamp(60px,18vh,100px); overflow-y:auto;
  padding:4px 0;
}
.alerts-log::-webkit-scrollbar{width:3px}
.alerts-log::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08)}

#log-placeholder { padding:8px 10px; text-align:center; font-size:10px; color:var(--t3); font-family:var(--mono); }

.alert-entry {
  padding:6px 10px; margin:3px 6px; border-radius:6px;
  background:rgba(255,69,58,.08); border-left:3px solid var(--red);
  animation:slideIn .3s ease;
}
.alert-entry.warn { background:rgba(255,163,64,.08); border-left-color:var(--amber); }
.alert-time { font-family:var(--mono); font-size:8px; color:var(--t3); }
.alert-msg  { font-size:clamp(9px,1.6vw,11px); color:var(--t1); margin-top:2px; }
.alert-level{ font-family:var(--mono); font-size:8px; }
@keyframes slideIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="wrap">

  <!-- HEADER -->
  <header class="hdr" id="hdr">
    <div class="hdr-l">
      <div class="m-ico">⚠️</div>
      <span class="m-name">{{ config.name if config else 'Danger Monitor' }}</span>
    </div>
    <span class="status-text" id="global-status">SURVEILLANCE ACTIVE</span>
  </header>

  <!-- CENTRE -->
  <div class="center">

    <!-- Radar -->
    <div class="radar-wrap">
      <div class="radar-circle" id="radar">
        <div class="radar-sweep"></div>
        <div id="dist-val">--</div>
        <div class="dist-unit">CM · DISTANCE</div>
      </div>
    </div>

    <!-- Gaz -->
    <div class="gas-row">
      <span class="gas-label">GAZ</span>
      <div class="gas-bar-wrap"><div class="gas-bar" id="gas-bar"></div></div>
      <span id="gas-num">--</span>
    </div>

    <!-- Log alertes -->
    <div class="alerts-panel">
      <div class="alerts-head">
        Alertes
        <span class="alert-count" id="alert-count">0</span>
      </div>
      <div class="alerts-log" id="log">
        <div id="log-placeholder">En attente de données...</div>
      </div>
    </div>

  </div>
</div>

<script>
const socket       = io();
const body         = document.body;
const hdr          = document.getElementById('hdr');
const log          = document.getElementById('log');
const placeholder  = document.getElementById('log-placeholder');
const distVal      = document.getElementById('dist-val');
const gasNum       = document.getElementById('gas-num');
const gasBar       = document.getElementById('gas-bar');
const statusText   = document.getElementById('global-status');
const radar        = document.getElementById('radar');
const alertCountEl = document.getElementById('alert-count');

let lastDangerTime  = 0;
let totalAlerts     = 0;
const GAS_WARN      = 200;
const GAS_DANGER    = 400;
const DIST_DANGER   = 30;

/* ── Logique originale conservée ── */
socket.on('module_update', function(msg) {
  if (msg.module === "danger_monitor") {
    renderAlerts(msg.data.alerts);
    lastDangerTime = Date.now();
  }
});

socket.on('sensor_update', function(data) {
  // Distance
  if (data.distance !== undefined && data.distance !== -1) {
    const d = Math.round(data.distance);
    distVal.textContent = d;
    const isDanger = d < DIST_DANGER;
    distVal.classList.toggle('danger', isDanger);
    radar.classList.toggle('danger', isDanger);
  }
  // Gaz
  if (data.gas !== undefined) {
    const g = +data.gas;
    gasNum.textContent = g;
    const pct = Math.min(100, (g / GAS_DANGER) * 100);
    gasBar.style.width = pct + '%';
    const isDanger = g > GAS_DANGER;
    const isWarn   = g > GAS_WARN;
    gasNum.classList.toggle('danger', isDanger);
    gasBar.classList.toggle('danger', isDanger);
    gasBar.style.background = isDanger ? 'var(--red)' : isWarn ? 'var(--amber)' : 'var(--green)';
  }
});

function renderAlerts(alerts) {
  if (!alerts || alerts.length === 0) return;

  // Alerte visuelle globale (logique originale)
  body.classList.add('alert-active');
  hdr.classList.add('danger');
  statusText.textContent = '⚠ DANGER DÉTECTÉ';
  statusText.classList.add('danger');

  if (placeholder.parentNode) placeholder.remove();

  alerts.forEach(alert => {
    totalAlerts++;
    const entry    = document.createElement('div');
    const isCrit   = alert.level === 'CRITICAL';
    entry.className = 'alert-entry' + (isCrit ? '' : ' warn');

    const t = new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    entry.innerHTML =
      '<div class="alert-time">' + t + '</div>' +
      '<div class="alert-msg">' +
        '<strong>' + (alert.type||'') + '</strong>' +
        (alert.value ? ' : ' + alert.value : '') +
      '</div>' +
      '<div class="alert-level" style="color:' + (isCrit?'var(--red)':'var(--amber)') + '">' + (alert.level||'') + '</div>';

    log.prepend(entry);
    if (log.children.length > 5) log.lastElementChild.remove();
  });

  alertCountEl.textContent = totalAlerts;
  alertCountEl.classList.add('visible');
}

// Nettoyage automatique (logique originale)
setInterval(() => {
  if (Date.now() - lastDangerTime > 4000) {
    body.classList.remove('alert-active');
    hdr.classList.remove('danger');
    statusText.textContent = 'SURVEILLANCE ACTIVE';
    statusText.classList.remove('danger');
  }
}, 1000);

socket.on('disconnect', () => {
  statusText.textContent = 'DÉCONNECTÉ';
  statusText.style.color = 'var(--red)';
});
</script>
</body>
</html>
