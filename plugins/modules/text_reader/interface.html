<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N.O.V.A - {{ config.name }}</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        :root {
            --ocr-gold: #ffcc00;
            --ocr-bg: #050505;
        }

        body {
            background: var(--ocr-bg);
            color: white;
            font-family: 'Consolas', 'Courier New', monospace;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            border: 2px solid var(--ocr-gold);
            overflow: hidden;
        }

        /* En-tête Tactique */
        .header {
            padding: 10px 20px;
            background: rgba(255, 204, 0, 0.1);
            border-bottom: 1px solid var(--ocr-gold);
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        .scanning-loader {
            color: var(--ocr-gold);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        /* Zone de Vision */
        .viewport {
            position: relative;
            flex-grow: 1;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .camera-stream {
            max-width: 100%;
            max-height: 100%;
            opacity: 0.7; /* Légère transparence pour le style HUD */
        }

        /* Cadre de visée (Targeting Box) */
        .aim-box {
            position: absolute;
            width: 70%;
            height: 35%;
            border: 2px solid var(--ocr-gold);
            box-shadow: 0 0 20px rgba(255, 204, 0, 0.3);
            pointer-events: none;
        }

        .aim-box::after {
            content: "ZONE D'EXTRACTION OCR";
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.7rem;
            color: var(--ocr-gold);
        }

        /* Panneau de Résultat (Bas de l'écran) */
        .result-panel {
            height: 25%;
            background: rgba(0, 0, 0, 0.9);
            border-top: 1px solid var(--ocr-gold);
            padding: 15px;
            overflow-y: auto;
        }

        .text-output {
            font-size: 1.2rem;
            line-height: 1.5;
            color: #ffffff;
            text-shadow: 0 0 5px rgba(255,255,255,0.5);
        }

        .placeholder {
            color: #444;
            font-style: italic;
            text-align: center;
            margin-top: 10px;
        }

        .back-link {
            position: absolute;
            top: 50px;
            right: 20px;
            color: var(--ocr-gold);
            text-decoration: none;
            border: 1px solid var(--ocr-gold);
            padding: 5px 10px;
            font-size: 0.8rem;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="header">
        <span>UNITÉ : {{ config.name }}</span>
        <span class="scanning-loader" id="status" style="transition: color 0.3s;">RECHERCHE DE CARACTÈRES...</span>
    </div>

    <a href="/" class="back-link">X QUITTER</a>

    <div class="viewport">
        <img src="/video_feed" id="video_stream" alt="Lecteur de Texte">
        
        <div class="aim-box">
            <div class="scan-line"></div>
        </div>
    </div>

    <div class="result-panel">
        <div id="no-text" class="placeholder">Positionnez le texte dans la zone de visée...</div>
        <div id="output" class="text-output" style="display: none; white-space: pre-wrap;"></div>
    </div>

    <script>
        const socket = io();
        const output = document.getElementById('output');
        const noText = document.getElementById('no-text');
        const status = document.getElementById('status');
        
        let clearTimer;

        // Réception des données du plugin (via nova.py)
        socket.on('plugin_data', function(data) {
            // On s'assure que le message vient du plugin OCR
            if (data.plugin === "text_reader") {
                
                if (data.text && data.text.trim().length > 2) {
                    // 1. Mise à jour du texte
                    noText.style.display = 'none';
                    output.style.display = 'block';
                    output.innerText = data.text;

                    // 2. Feedback visuel
                    status.innerText = "TEXTE DÉTECTÉ ✅";
                    status.style.color = "#00ff88";

                    // 3. Reset du timer de nettoyage
                    // Si on ne reçoit plus rien pendant 3 secondes, on efface l'écran
                    clearTimeout(clearTimer);
                    clearTimer = setTimeout(() => {
                        output.style.display = 'none';
                        noText.style.display = 'block';
                        status.innerText = "RECHERCHE DE CARACTÈRES...";
                        status.style.color = "#00f2ff";
                    }, 3000);

                } else {
                    // Si le texte est vide ou trop court
                    status.innerText = "ANALYSE EN COURS...";
                    status.style.color = "#ffcc00";
                }
            }
        });

        // Gestion de la déconnexion
        socket.on('disconnect', () => {
            status.innerText = "ERREUR LIAISON S.H.O.S";
            status.style.color = "#ff0044";
        });
    </script>

    <style>
        /* Ajout de l'animation de scan pour le HUD */
        .scan-line {
            position: absolute;
            width: 100%;
            height: 2px;
            background: rgba(0, 242, 255, 0.5);
            box-shadow: 0 0 15px #00f2ff;
            top: 0;
            animation: scanMove 2s linear infinite;
        }

        @keyframes scanMove {
            0% { top: 0%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        .text-output {
            color: #fff;
            text-shadow: 0 0 5px #00f2ff;
            background: rgba(0, 50, 80, 0.3);
            padding: 15px;
            border-left: 3px solid #00f2ff;
            font-size: 1.2rem;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</body>
</html>
