<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S.H.O.S · Lecteur Texte</title>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════
   MODULE : LECTEUR TEXTE (OCR) — S.H.O.S
   Logique originale (plugin_data / text_reader) conservée
═══════════════════════════════════════════════ */
:root {
  --bg:    #0e1117;
  --glass: rgba(255,255,255,0.055);
  --border:rgba(255,255,255,0.09);
  --y:     #e8d44d;
  --y2:    rgba(232,212,77,0.12);
  --blue:  #4da6ff;
  --green: #34c759;
  --red:   #ff453a;
  --amber: #ffa340;
  --t1:    rgba(255,255,255,0.93);
  --t2:    rgba(255,255,255,0.52);
  --t3:    rgba(255,255,255,0.28);
  --font:  'DM Sans', system-ui, sans-serif;
  --mono:  'DM Mono', monospace;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;font-family:var(--font);background:var(--bg);color:var(--t1)}

/* ── LAYOUT ── */
.wrap { height:100vh; display:flex; flex-direction:column; }

/* ── HEADER ── */
.hdr {
  display:flex; align-items:center; justify-content:space-between;
  padding:clamp(7px,1.8vh,12px) clamp(10px,2vw,16px);
  background:rgba(14,17,23,.97); border-bottom:1px solid var(--border);
  flex-shrink:0; gap:8px;
}
.hdr-l { display:flex; align-items:center; gap:7px; min-width:0; }
.m-ico { width:20px; height:20px; border-radius:6px; background:var(--y2); border:1px solid rgba(232,212,77,.28); display:flex; align-items:center; justify-content:center; font-size:11px; flex-shrink:0; }
.m-name { font-size:clamp(9px,1.6vw,11px); font-weight:500; letter-spacing:.08em; text-transform:uppercase; color:var(--t2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.spill {
  display:flex; align-items:center; gap:4px; padding:3px 9px; border-radius:10px;
  background:rgba(255,255,255,.06); border:1px solid var(--border);
  font-family:var(--mono); font-size:clamp(8px,1.4vw,10px); color:var(--t2); flex-shrink:0; transition:all .3s;
}
.dot { width:5px; height:5px; border-radius:50%; }
.d-y  { background:var(--y); box-shadow:0 0 6px var(--y); animation:scan-dot 1.5s ease-in-out infinite; }
.d-ok { background:var(--green); box-shadow:0 0 6px var(--green); }
.d-w  { background:rgba(255,255,255,.3); }
@keyframes scan-dot{0%,100%{opacity:1}50%{opacity:.3}}

/* ── VIEWFINDER (zone vidéo) ── */
.viewport {
  position:relative; flex:1;
  background:#000; display:flex; align-items:center; justify-content:center;
  overflow:hidden; min-height:0;
}
.viewport img { width:100%; height:100%; object-fit:cover; display:block; opacity:.8; }

/* Zone de visée OCR */
.aim-box {
  position:absolute; z-index:3; pointer-events:none;
  width:clamp(60%,72%,80%); height:clamp(25%,32%,40%);
  border:1.5px solid var(--y); box-shadow:0 0 16px rgba(232,212,77,.2);
  top:50%; left:50%; transform:translate(-50%,-60%);
}
/* Coins du viseur */
.aim-box::before, .aim-box::after {
  content:''; position:absolute; width:10px; height:10px; border-color:var(--y); border-style:solid;
}
.aim-box::before { top:-1px; left:-1px; border-width:2px 0 0 2px; }
.aim-box::after  { bottom:-1px; right:-1px; border-width:0 2px 2px 0; }

/* Label zone OCR */
.aim-label {
  position:absolute; top:-18px; left:50%; transform:translateX(-50%);
  font-family:var(--mono); font-size:8px; letter-spacing:.12em;
  color:var(--y); text-transform:uppercase; white-space:nowrap;
}

/* Ligne de scan animée */
.scan-beam {
  position:absolute; left:0; right:0; height:1.5px; z-index:4; pointer-events:none;
  background:linear-gradient(90deg, transparent, var(--y), transparent);
  box-shadow:0 0 10px rgba(232,212,77,.5);
  animation:beamMove 2.2s linear infinite;
}
@keyframes beamMove { 0%{top:35%;opacity:0} 5%{opacity:1} 90%{opacity:1} 100%{top:65%;opacity:0} }

/* ── PANNEAU RÉSULTAT ── */
.result-panel {
  flex-shrink:0; height:clamp(80px,28%,130px);
  background:rgba(14,17,23,.96); border-top:1px solid var(--border);
  display:flex; flex-direction:column; overflow:hidden;
}
.result-head {
  display:flex; align-items:center; gap:8px;
  padding:5px 12px; border-bottom:1px solid var(--border); flex-shrink:0;
}
.result-label {
  font-family:var(--mono); font-size:9px; letter-spacing:.10em;
  text-transform:uppercase; color:var(--t3);
}
.result-status {
  font-family:var(--mono); font-size:9px; color:var(--t2);
  margin-left:auto; letter-spacing:.06em; transition:color .3s;
}
.result-status.detected { color:var(--green); }
.result-status.scanning { color:var(--y); }

.result-body { flex:1; overflow-y:auto; padding:8px 12px; }
.result-body::-webkit-scrollbar { width:3px; }
.result-body::-webkit-scrollbar-thumb { background:rgba(255,255,255,.08); }

#no-text {
  font-size:clamp(9px,1.6vw,11px); color:var(--t3); font-family:var(--mono);
  font-style:italic; padding-top:4px;
}
#output {
  display:none;
  font-size:clamp(11px,2vw,14px); line-height:1.6; color:var(--t1);
  white-space:pre-wrap; font-family:var(--mono);
  border-left:2px solid var(--y); padding-left:8px;
  animation:fadeText .3s ease;
}
@keyframes fadeText { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:none} }
</style>
</head>
<body>
<div class="wrap">

  <!-- HEADER -->
  <header class="hdr">
    <div class="hdr-l">
      <div class="m-ico">📖</div>
      <span class="m-name">{{ config.name if config else 'Lecteur Texte' }}</span>
    </div>
    <div class="spill" id="status-pill">
      <div class="dot d-y" id="status-dot"></div>
      <span id="status">SCAN EN COURS</span>
    </div>
  </header>

  <!-- VIEWFINDER -->
  <div class="viewport">
    <div class="scan-beam"></div>
    <img src="/video_feed" id="video_stream" alt="OCR Stream"
         onerror="this.style.display='none'">
    <div class="aim-box">
      <div class="aim-label">Zone d'extraction OCR</div>
    </div>
  </div>

  <!-- RÉSULTAT -->
  <div class="result-panel">
    <div class="result-head">
      <span class="result-label">Texte extrait</span>
      <span class="result-status" id="result-status">En attente...</span>
    </div>
    <div class="result-body">
      <div id="no-text">Positionnez le texte dans la zone de visée...</div>
      <div id="output"></div>
    </div>
  </div>

</div>

<script>
const socket     = io();
const output     = document.getElementById('output');
const noText     = document.getElementById('no-text');
const statusEl   = document.getElementById('status');
const statusDot  = document.getElementById('status-dot');
const resultStat = document.getElementById('result-status');

let clearTimer;

/* ── Logique originale conservée ── */
socket.on('plugin_data', function(data) {
  if (data.plugin === "text_reader") {
    if (data.text && data.text.trim().length > 2) {
      // Affichage texte
      noText.style.display = 'none';
      output.style.display = 'block';
      output.textContent   = data.text;

      // Feedback visuel
      statusEl.textContent   = 'TEXTE DÉTECTÉ';
      statusDot.className    = 'dot d-ok';
      resultStat.textContent = 'DÉTECTÉ ✓';
      resultStat.className   = 'result-status detected';

      // Timer de nettoyage (logique originale)
      clearTimeout(clearTimer);
      clearTimer = setTimeout(() => {
        output.style.display = 'none';
        noText.style.display = 'block';
        statusEl.textContent   = 'SCAN EN COURS';
        statusDot.className    = 'dot d-y';
        resultStat.textContent = 'En attente...';
        resultStat.className   = 'result-status';
      }, 3000);

    } else {
      statusEl.textContent   = 'ANALYSE EN COURS';
      statusDot.className    = 'dot d-w';
      resultStat.textContent = 'Traitement...';
      resultStat.className   = 'result-status scanning';
    }
  }
});

socket.on('disconnect', () => {
  statusEl.textContent = 'DÉCONNECTÉ';
  statusDot.className  = 'dot';
  statusDot.style.background = '#ff453a';
});
</script>
</body>
</html>
